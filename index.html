<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이창헌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>이창헌</h1>
    <p>Photo Gallery</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>&copy; 2026 leechangheon</footer>

  <div class="lightbox" id="lightbox">
    <button class="close" aria-label="close">&times;</button>
    <button class="nav prev" aria-label="previous">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="nav next" aria-label="next">&#10095;</button>
  </div>

  <script>
    const TOTAL = 70;
    const grid = document.getElementById('grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let current = 0;

    for (let i = 1; i <= TOTAL; i++) {
      const figure = document.createElement('figure');
      const img = document.createElement('img');
      img.src = `photos/${i}.webp`;
      img.alt = `photo ${i}`;
      img.loading = 'lazy';
      figure.appendChild(img);
      figure.addEventListener('click', () => openLightbox(i - 1));
      grid.appendChild(figure);
    }

    function openLightbox(index) {
      current = index;
      lightboxImg.src = `photos/${current + 1}.webp`;
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
    }
    function show(delta) {
      current = (current + delta + TOTAL) % TOTAL;
      lightboxImg.src = `photos/${current + 1}.webp`;
    }

    lightbox.querySelector('.close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.prev').addEventListener('click', () => show(-1));
    lightbox.querySelector('.next').addEventListener('click', () => show(1));
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') show(-1);
      if (e.key === 'ArrowRight') show(1);
    });
  </script>
</body>
</html>
