<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이창헌</title>
<style>
  :root {
    --bg: #0b0b0c;
    --fg: #f2f2f2;
    --muted: #8a8a8a;
    --gap: 6px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  header {
    padding: 32px 16px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--gap);
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px;
  }
  .grid figure {
    margin: 0;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #1a1a1a;
    cursor: zoom-in;
    border-radius: 4px;
  }
  .grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }
  .grid figure:hover img {
    transform: scale(1.05);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 24px 16px 40px;
  }

  /* lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 4px;
  }
  .lightbox .close,
  .lightbox .nav {
    position: absolute;
    background: none;
    border: none;
    color: var(--fg);
    font-size: 2rem;
    cursor: pointer;
    line-height: 1;
    padding: 8px 14px;
    user-select: none;
  }
  .lightbox .close { top: 12px; right: 16px; }
  .lightbox .prev { left: 8px; top: 50%; transform: translateY(-50%); }
  .lightbox .next { right: 8px; top: 50%; transform: translateY(-50%); }

  @media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 720px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); --gap: 4px; }
    .lightbox .prev, .lightbox .next { font-size: 1.5rem; padding: 6px 10px; }
  }
</style>
</head>
<body>
  <header>
    <h1>이창헌</h1>
    <p>Photo Gallery</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>&copy; 2026 leechangheon</footer>

  <div class="lightbox" id="lightbox">
    <button class="close" aria-label="close">&times;</button>
    <button class="nav prev" aria-label="previous">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="nav next" aria-label="next">&#10095;</button>
  </div>

  <script>
    const TOTAL = 70;
    const grid = document.getElementById('grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let current = 0;

    for (let i = 1; i <= TOTAL; i++) {
      const figure = document.createElement('figure');
      const img = document.createElement('img');
      img.src = `photos/${i}.webp`;
      img.alt = `photo ${i}`;
      img.loading = 'lazy';
      figure.appendChild(img);
      figure.addEventListener('click', () => openLightbox(i - 1));
      grid.appendChild(figure);
    }

    function openLightbox(index) {
      current = index;
      lightboxImg.src = `photos/${current + 1}.webp`;
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
    }
    function show(delta) {
      current = (current + delta + TOTAL) % TOTAL;
      lightboxImg.src = `photos/${current + 1}.webp`;
    }

    lightbox.querySelector('.close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.prev').addEventListener('click', () => show(-1));
    lightbox.querySelector('.next').addEventListener('click', () => show(1));
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') show(-1);
      if (e.key === 'ArrowRight') show(1);
    });
  </script>
</body>
</html>
