<script>
  (() => {
    const icons = ['favicon-1.svg', 'favicon-2.svg', 'favicon-3.svg', 'favicon-4.svg'];
    const storageKey = 'lee-chang-favicon';
    const getPreviousIcon = () => {
      try {
        if (window.localStorage) return window.localStorage.getItem(storageKey);
      } catch (error) {}

      return document.cookie
        .split('; ')
        .find((item) => item.startsWith(`${storageKey}=`))
        ?.split('=')[1];
    };
    const setPreviousIcon = (icon) => {
      try {
        if (window.localStorage) window.localStorage.setItem(storageKey, icon);
      } catch (error) {}

      document.cookie = `${storageKey}=${icon}; path=/; max-age=31536000; SameSite=Lax`;
    };
    const previousIcon = getPreviousIcon();
    const candidates = icons.filter((item) => item !== previousIcon);
    const pool = candidates.length ? candidates : icons;
    const icon = pool[Math.floor(Math.random() * pool.length)];
    setPreviousIcon(icon);
    document.querySelectorAll('link[rel~="icon"][data-random-favicon]').forEach((link) => {
      link.href = icon;
    });
  })();
</script>
</head>
<body>
  <header>
    <h1><button type="button" id="reload-page">이창 <span class="en">Lee Chang</span></button></h1>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    <a class="footer-mail" href="mailto:lee.changlegs@gmail.com">✉ <span class="en">lee.changlegs@gmail.com</span></a>
    <a class="footer-shed" href="shed.html">헛간 <span class="en">Shed</span></a>

  </footer>

  <div class="lightbox" id="lightbox">
    <button class="close" aria-label="close"></button>
    <img id="lightbox-img" src="" alt="">
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <script src="artworks.js?v=20261006-20"></script>
  <script>
    const MAIN_PHOTO_LIMIT = 71;
    const grid = document.getElementById('grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const title = document.querySelector('header h1');
    const footer = document.querySelector('footer');
    const reloadButton = document.getElementById('reload-page');
    const sampleCanvas = document.createElement('canvas');
    const sampleContext = sampleCanvas.getContext('2d', { willReadFrequently: true });
    let current = 0;
    const mobileQuery = window.matchMedia(
      '(max-width: 768px) and (hover: none), ' +
      '(max-width: 768px) and (pointer: coarse)'
    );
    let layoutFrame;
    let mobileLandingStarted = false;

    if (mobileQuery.matches) {
      document.body.classList.add('mobile-landing-active');
    }

    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    const captions = Object.fromEntries(
      ARTWORKS.map(({ id, caption }) => [id, caption])
    );

    reloadButton.addEventListener('click', () => {
      window.scrollTo(0, 0);
      window.location.reload();
    });

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatEnglishText(text) {
      return escapeHtml(text)
        .replace(
          /[A-Za-z0-9][A-Za-z0-9\s.,'’:&()/]*/g,
          '<span class="en">$&</span>'
        )
        .replace(/[—×]/g, '<span class="symbol">$&</span>')
        .replace(/\(/g, '<span class="open-paren">(</span>');
    }

    function formatCaption(text, separator = ' │ ') {
      const parts = text.split(' │ ');
      const titleCount = Math.max(1, parts.length - 3);

      return parts.map((part, index) => {
        const formatted = formatEnglishText(part);

        if (index >= titleCount) return formatted;

        const languageClass = /[가-힣]/.test(part) ? 'caption-title-ko' : 'caption-title-en';
        return `<span class="caption-title ${languageClass}">${formatted}</span>`;
      }).join(separator);
    }

    const paleCandidates = [58, 59, 62, 63, 64, 65, 66, 67, 68, 69];
    const hiddenPalePhotos = new Set(
      [...paleCandidates]
        .sort(() => Math.random() - 0.5)
        .slice(0, 5)
        .map((number) => `photos/${number}.webp`)
    );

    const photos = ARTWORKS
      .map(({ id }) => id)
      .filter((id) => id <= MAIN_PHOTO_LIMIT && !hiddenPalePhotos.has(`photos/${id}.webp`))
      .map((id) => `photos/${id}.webp`);

    for (let i = photos.length - 1; i > 0; i--) {
      const randomIndex = Math.floor(Math.random() * (i + 1));
      [photos[i], photos[randomIndex]] = [photos[randomIndex], photos[i]];
    }


    function getDisplaySrc(src) {
      return mobileQuery.matches
        ? src.replace('photos/', 'photos/mobile/')
        : src;
    }

    function createFigure(src, index) {
      const figure = document.createElement('figure');
      const img = document.createElement('img');
      figure.dataset.layoutRandom = Math.random();
      img.src = getDisplaySrc(src);
      const photoNumber = Number(src.match(/\d+/)[0]);
      img.alt = captions[photoNumber] || '이창 Lee Chang 작품';
      img.loading = mobileQuery.matches ? 'lazy' : 'eager';
      img.decoding = 'async';
      img.addEventListener('load', scheduleLayout);
      img.addEventListener('error', () => {
        if (img.getAttribute('src') !== src) {
          img.src = src;
        }
        scheduleLayout();
      }, { once: true });
      figure.appendChild(img);
      figure.addEventListener('click', () => openLightbox(index));
      grid.appendChild(figure);
    }

    photos.forEach((src, index) => createFigure(src, index));

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function getVisibleFigures() {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      return [...grid.querySelectorAll('figure')].filter((figure) => {
        const rect = figure.getBoundingClientRect();
        return (
          rect.width > 0 &&
          rect.height > 0 &&
          rect.bottom > 0 &&
          rect.right > 0 &&
          rect.top < viewportHeight &&
          rect.left < viewportWidth
        );
      });
    }

    async function pulseFigure(figure) {
      figure.classList.remove('mobile-focus-pulse');
      void figure.offsetWidth;
      figure.classList.add('mobile-focus-pulse');
      await delay(1000);
      figure.classList.remove('mobile-focus-pulse');
    }

    async function startMobileLandingSequence() {
      if (!mobileQuery.matches || mobileLandingStarted) return;
      mobileLandingStarted = true;

      await new Promise((resolve) => requestAnimationFrame(resolve));
      scheduleLayout();
      await new Promise((resolve) => requestAnimationFrame(resolve));
      document.body.classList.add('mobile-gallery-visible');
      await delay(1000);

      const visibleFigures = getVisibleFigures().sort(() => Math.random() - 0.5).slice(0, 3);
      for (const figure of visibleFigures) {
        await pulseFigure(figure);
      }

      document.body.classList.add('mobile-all-clear');
      await delay(500);
      document.body.classList.remove('mobile-all-clear');
      await delay(500);
      document.body.classList.remove('mobile-landing-active', 'mobile-gallery-visible');
    }

    function scheduleLayout() {
      cancelAnimationFrame(layoutFrame);
      layoutFrame = requestAnimationFrame(layoutGallery);
    }

    function layoutGallery() {
      const containerWidth = grid.clientWidth;
      const figures = [...grid.querySelectorAll('figure')];
      if (!figures.length) {
        grid.style.height = '0px';
        updateInterfaceColors();
        return;
      }
      const firstRandom = Number(figures[0]?.dataset.layoutRandom || 0);
      const minColumnCount = mobileQuery.matches ? 4 : 3;
      const desiredColumnCount = minColumnCount + Math.floor(firstRandom * (8 - minColumnCount));
      const columnCount = Math.max(1, Math.min(desiredColumnCount, figures.length));
      const columns = Array.from({ length: columnCount }, () => []);

      figures.forEach((figure, index) => {
        columns[index % columnCount].push(figure);
      });

      const columnFactors = columns.map((column) =>
        column.reduce((sum, figure) => {
          const img = figure.querySelector('img');
          const ratio = img.naturalWidth && img.naturalHeight
            ? img.naturalWidth / img.naturalHeight
            : 1;
          return sum + 1 / ratio;
        }, 0)
      );

      const equalHeight = containerWidth /
        columnFactors.reduce((sum, factor) => sum + 1 / factor, 0);
      const columnWidths = columnFactors.map(
        (factor) => equalHeight / factor
      );

      let left = 0;

      columns.forEach((column, columnIndex) => {
        const width = columnIndex === columns.length - 1
          ? containerWidth - left
          : columnWidths[columnIndex];
        let top = 0;

        column.forEach((figure, imageIndex) => {
          const img = figure.querySelector('img');
          const ratio = img.naturalWidth && img.naturalHeight
            ? img.naturalWidth / img.naturalHeight
            : 1;
          const height = imageIndex === column.length - 1
            ? equalHeight - top
            : width / ratio;

          figure.style.width = `${width}px`;
          figure.style.height = `${height}px`;
          figure.style.left = `${left}px`;
          figure.style.top = `${top}px`;

          top += height;
        });

        left += width;
      });

      grid.style.height = `${equalHeight}px`;
      updateInterfaceColors();
    }

    function getImageLuminanceAt(img, x, y) {
      if (!img.complete || !img.naturalWidth || !sampleContext) return null;

      const rect = img.getBoundingClientRect();
      const sourceX = ((x - rect.left) / rect.width) * img.naturalWidth;
      const sourceY = ((y - rect.top) / rect.height) * img.naturalHeight;

      if (
        sourceX < 0 ||
        sourceY < 0 ||
        sourceX > img.naturalWidth ||
        sourceY > img.naturalHeight
      ) {
        return null;
      }

      sampleCanvas.width = 1;
      sampleCanvas.height = 1;
      sampleContext.clearRect(0, 0, 1, 1);
      sampleContext.drawImage(
        img,
        sourceX,
        sourceY,
        1,
        1,
        0,
        0,
        1,
        1
      );

      const [red, green, blue] = sampleContext.getImageData(0, 0, 1, 1).data;
      return red * 0.2126 + green * 0.7152 + blue * 0.0722;
    }

    function updateTitleColor() {
      const rect = title.getBoundingClientRect();
      const y = rect.top + rect.height / 2;
      const center = window.innerWidth / 2;
      const sampleOffsets = [-140, -70, 0, 70, 140];
      const luminances = [];

      sampleOffsets.forEach((offset) => {
        const x = Math.min(window.innerWidth - 1, Math.max(0, center + offset));
        const img = document.elementsFromPoint(x, y).find(
          (element) => element.tagName === 'IMG' && element.closest('.grid')
        );
        const luminance = img ? getImageLuminanceAt(img, x, y) : 255;

        if (luminance !== null) luminances.push(luminance);
      });

      const averageLuminance = luminances.length
        ? luminances.reduce((sum, value) => sum + value, 0) / luminances.length
        : 255;

      title.classList.toggle('over-bright-bg', averageLuminance > 178);
    }

    function updateFooterColor() {
      const gridRect = grid.getBoundingClientRect();
      const footerRect = footer.getBoundingClientRect();
      const footerCenter = footerRect.top + footerRect.height / 2;
      const fadeStart = gridRect.bottom - window.innerHeight * 0.33;
      const isOverGallery =
        footerCenter >= gridRect.top && footerCenter <= fadeStart;

      footer.classList.toggle('over-gallery', isOverGallery);
    }

    function updateInterfaceColors() {
      updateFooterColor();
      updateTitleColor();
    }

    window.addEventListener('load', () => {
      window.scrollTo(0, 0);
      scheduleLayout();
      startMobileLandingSequence();
    });
    window.addEventListener('resize', scheduleLayout);
    window.addEventListener('scroll', updateInterfaceColors, { passive: true });
    scheduleLayout();
    updateInterfaceColors();

    function openLightbox(index) {
      current = index;
      updateLightbox();
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
    }
    function show(delta) {
      current = (current + delta + photos.length) % photos.length;
      updateLightbox();
    }
    function updateLightbox() {
      const src = photos[current];
      const photoNumber = Number(src.match(/\d+/)[0]);
      lightboxImg.src = src;
      lightboxCaption.innerHTML = formatCaption(captions[photoNumber] || "");
    }

    lightbox.querySelector('.close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') show(-1);
      if (e.key === 'ArrowRight') show(1);
    });
  </script>
</body>
