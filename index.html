<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이창헌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>이창헌</h1>
  </header>

  <main class="grid" id="grid"></main>

  <footer>&copy; 2026 leechangheon</footer>

  <div class="lightbox" id="lightbox">
    <button class="close" aria-label="close">&times;</button>
    <button class="nav prev" aria-label="previous">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="nav next" aria-label="next">&#10095;</button>
  </div>

  <script>
    const TOTAL = 70;
    const grid = document.getElementById('grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let current = 0;

    const photos = Array.from(
      { length: TOTAL },
      (_, index) => `photos/${index + 1}.webp`
    );

    for (let i = photos.length - 1; i > 0; i--) {
      const randomIndex = Math.floor(Math.random() * (i + 1));
      [photos[i], photos[randomIndex]] = [photos[randomIndex], photos[i]];
    }

    function createRowSizes(total) {
      const sizes = [];
      let remaining = total;

      while (remaining > 0) {
        const choices = [];
        for (let size = 3; size <= Math.min(7, remaining); size++) {
          const rest = remaining - size;
          if (rest === 0 || rest >= 3) choices.push(size);
        }

        const size = choices[Math.floor(Math.random() * choices.length)];
        sizes.push(size);
        remaining -= size;
      }

      return sizes;
    }

    const rowSizes = createRowSizes(TOTAL);

    photos.forEach((src, index) => {
      const figure = document.createElement('figure');
      const img = document.createElement('img');
      img.src = src;
      img.alt = `photo ${src.match(/\d+/)[0]}`;
      img.loading = 'eager';
      img.addEventListener('load', scheduleLayout);
      figure.appendChild(img);
      figure.addEventListener('click', () => openLightbox(index));
      grid.appendChild(figure);
    });

    let layoutFrame;

    function scheduleLayout() {
      cancelAnimationFrame(layoutFrame);
      layoutFrame = requestAnimationFrame(layoutGallery);
    }

    function layoutGallery() {
      const containerWidth = grid.clientWidth;
      const figures = [...grid.querySelectorAll('figure')];
      let figureIndex = 0;
      let top = 0;

      rowSizes.forEach((rowSize) => {
        const row = figures.slice(figureIndex, figureIndex + rowSize);
        const ratios = row.map((figure) => {
          const img = figure.querySelector('img');
          return img.naturalWidth && img.naturalHeight
            ? img.naturalWidth / img.naturalHeight
            : 1;
        });
        const ratioTotal = ratios.reduce((sum, ratio) => sum + ratio, 0);
        const rowHeight = containerWidth / ratioTotal;
        let left = 0;

        row.forEach((figure, index) => {
          const width = index === row.length - 1
            ? containerWidth - left
            : rowHeight * ratios[index];

          figure.style.width = `${width}px`;
          figure.style.height = `${rowHeight}px`;
          figure.style.left = `${left}px`;
          figure.style.top = `${top}px`;

          left += width;
        });

        top += rowHeight;
        figureIndex += rowSize;
      });

      grid.style.height = `${top}px`;
    }

    window.addEventListener('load', scheduleLayout);
    window.addEventListener('resize', scheduleLayout);
    scheduleLayout();

    function openLightbox(index) {
      current = index;
      lightboxImg.src = photos[current];
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
    }
    function show(delta) {
      current = (current + delta + TOTAL) % TOTAL;
      lightboxImg.src = photos[current];
    }

    lightbox.querySelector('.close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.prev').addEventListener('click', () => show(-1));
    lightbox.querySelector('.next').addEventListener('click', () => show(1));
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') show(-1);
      if (e.key === 'ArrowRight') show(1);
    });
  </script>
</body>
</html>
