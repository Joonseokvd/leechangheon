<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이창헌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>이창헌</h1>
  </header>

  <main class="grid" id="grid"></main>

  <footer>&copy; 2026 leechangheon</footer>

  <div class="lightbox" id="lightbox">
    <button class="close" aria-label="close">&times;</button>
    <button class="nav prev" aria-label="previous">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="nav next" aria-label="next">&#10095;</button>
  </div>

  <script>
    const TOTAL = 70;
    const grid = document.getElementById('grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let current = 0;

    const photos = Array.from(
      { length: TOTAL },
      (_, index) => `photos/${index + 1}.webp`
    );

    for (let i = photos.length - 1; i > 0; i--) {
      const randomIndex = Math.floor(Math.random() * (i + 1));
      [photos[i], photos[randomIndex]] = [photos[randomIndex], photos[i]];
    }


    photos.forEach((src, index) => {
      const figure = document.createElement('figure');
      const img = document.createElement('img');
      figure.dataset.layoutRandom = Math.random();
      img.src = src;
      img.alt = `photo ${src.match(/\d+/)[0]}`;
      img.loading = 'eager';
      img.addEventListener('load', scheduleLayout);
      figure.appendChild(img);
      figure.addEventListener('click', () => openLightbox(index));
      grid.appendChild(figure);
    });

    let layoutFrame;

    function scheduleLayout() {
      cancelAnimationFrame(layoutFrame);
      layoutFrame = requestAnimationFrame(layoutGallery);
    }

    function layoutGallery() {
      const containerWidth = grid.clientWidth;
      const figures = [...grid.querySelectorAll('figure')];
      const trackCount = containerWidth > 1200 ? 7
        : containerWidth > 900 ? 6
        : containerWidth > 700 ? 5
        : containerWidth > 480 ? 4
        : 3;
      const trackWidth = containerWidth / trackCount;
      const skyline = Array(trackCount).fill(0);

      figures.forEach((figure) => {
        const img = figure.querySelector('img');
        const ratio = img.naturalWidth && img.naturalHeight
          ? img.naturalWidth / img.naturalHeight
          : 1;
        const random = Number(figure.dataset.layoutRandom);

        let span = ratio >= 1.7 ? 3 : ratio >= 1.05 ? 2 : 1;
        if (random > 0.8) span += 1;
        if (random < 0.15) span -= 1;
        span = Math.max(1, Math.min(3, trackCount, span));

        const starts = Array.from(
          { length: trackCount - span + 1 },
          (_, index) => index
        );
        const rotation = Math.floor(random * starts.length);
        const candidates = starts.slice(rotation).concat(starts.slice(0, rotation));

        let bestStart = candidates[0];
        let bestTop = Infinity;

        candidates.forEach((start) => {
          const top = Math.max(...skyline.slice(start, start + span));
          if (top < bestTop) {
            bestTop = top;
            bestStart = start;
          }
        });

        const width = trackWidth * span;
        const height = width / ratio;

        figure.style.width = `${width}px`;
        figure.style.height = `${height}px`;
        figure.style.left = `${bestStart * trackWidth}px`;
        figure.style.top = `${bestTop}px`;

        for (let track = bestStart; track < bestStart + span; track++) {
          skyline[track] = bestTop + height;
        }
      });

      grid.style.height = `${Math.max(...skyline)}px`;
    }

    window.addEventListener('load', scheduleLayout);
    window.addEventListener('resize', scheduleLayout);
    scheduleLayout();

    function openLightbox(index) {
      current = index;
      lightboxImg.src = photos[current];
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
    }
    function show(delta) {
      current = (current + delta + TOTAL) % TOTAL;
      lightboxImg.src = photos[current];
    }

    lightbox.querySelector('.close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.prev').addEventListener('click', () => show(-1));
    lightbox.querySelector('.next').addEventListener('click', () => show(1));
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') show(-1);
      if (e.key === 'ArrowRight') show(1);
    });
  </script>
</body>
</html>
