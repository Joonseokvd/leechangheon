<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이창헌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>이창헌</h1>
  </header>

  <main class="grid" id="grid"></main>

  <footer>&copy; 2026 leechangheon</footer>

  <div class="lightbox" id="lightbox">
    <button class="close" aria-label="close"></button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    const TOTAL = 70;
    const grid = document.getElementById('grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let current = 0;

    const photos = Array.from(
      { length: TOTAL },
      (_, index) => `photos/${index + 1}.webp`
    );

    for (let i = photos.length - 1; i > 0; i--) {
      const randomIndex = Math.floor(Math.random() * (i + 1));
      [photos[i], photos[randomIndex]] = [photos[randomIndex], photos[i]];
    }


    photos.forEach((src, index) => {
      const figure = document.createElement('figure');
      const img = document.createElement('img');
      figure.dataset.layoutRandom = Math.random();
      img.src = src;
      img.alt = `photo ${src.match(/\d+/)[0]}`;
      img.loading = 'eager';
      img.addEventListener('load', scheduleLayout);
      figure.appendChild(img);
      figure.addEventListener('click', () => openLightbox(index));
      grid.appendChild(figure);
    });

    let layoutFrame;

    function scheduleLayout() {
      cancelAnimationFrame(layoutFrame);
      layoutFrame = requestAnimationFrame(layoutGallery);
    }

    function layoutGallery() {
      const containerWidth = grid.clientWidth;
      const allFigures = [...grid.querySelectorAll('figure')];
      const closingCount = 5 + Math.floor(
        Number(allFigures[0]?.dataset.layoutRandom || 0) * 3
      );
      const figures = allFigures.slice(0, -closingCount);
      const closingFigures = allFigures.slice(-closingCount);
      const trackCount = containerWidth > 1200 ? 7
        : containerWidth > 900 ? 6
        : containerWidth > 700 ? 5
        : containerWidth > 480 ? 4
        : 3;
      const trackWidth = containerWidth / trackCount;
      const skyline = Array(trackCount).fill(0);

      figures.forEach((figure) => {
        const img = figure.querySelector('img');
        const ratio = img.naturalWidth && img.naturalHeight
          ? img.naturalWidth / img.naturalHeight
          : 1;
        const random = Number(figure.dataset.layoutRandom);

        let span = ratio >= 1.7 ? 3 : ratio >= 1.05 ? 2 : 1;
        if (random > 0.8) span += 1;
        if (random < 0.15) span -= 1;
        span = Math.max(1, Math.min(3, trackCount, span));

        let bestStart = 0;
        let bestTop = Infinity;
        let placementFound = false;

        while (!placementFound && span >= 1) {
          const starts = Array.from(
            { length: trackCount - span + 1 },
            (_, index) => index
          );
          const rotation = Math.floor(random * starts.length);
          const candidates = starts.slice(rotation).concat(starts.slice(0, rotation));

          candidates.forEach((start) => {
            const levels = skyline.slice(start, start + span);
            const top = Math.max(...levels);
            const bottom = Math.min(...levels);
            const isFlat = top - bottom < 0.5;

            if (isFlat && top < bestTop) {
              bestTop = top;
              bestStart = start;
              placementFound = true;
            }
          });

          if (!placementFound) span -= 1;
        }

        const width = trackWidth * span;
        const height = width / ratio;

        figure.style.width = `${width}px`;
        figure.style.height = `${height}px`;
        figure.style.left = `${bestStart * trackWidth}px`;
        figure.style.top = `${bestTop}px`;

        for (let track = bestStart; track < bestStart + span; track++) {
          skyline[track] = bestTop + height;
        }
      });

      const mainBottom = Math.max(...skyline);
      const closingRatios = closingFigures.map((figure) => {
        const img = figure.querySelector('img');
        return img.naturalWidth && img.naturalHeight
          ? img.naturalWidth / img.naturalHeight
          : 1;
      });
      const closingRatioTotal = closingRatios.reduce(
        (sum, ratio) => sum + ratio,
        0
      );
      const closingHeight = containerWidth / closingRatioTotal;
      const closingTop = Math.max(0, mainBottom - closingHeight);
      let closingLeft = 0;

      closingFigures.forEach((figure, index) => {
        const width = index === closingFigures.length - 1
          ? containerWidth - closingLeft
          : closingHeight * closingRatios[index];

        figure.style.width = `${width}px`;
        figure.style.height = `${closingHeight}px`;
        figure.style.left = `${closingLeft}px`;
        figure.style.top = `${closingTop}px`;
        closingLeft += width;
      });

      grid.style.height = `${Math.max(mainBottom, closingTop + closingHeight)}px`;
    }

    window.addEventListener('load', scheduleLayout);
    window.addEventListener('resize', scheduleLayout);
    scheduleLayout();

    function openLightbox(index) {
      current = index;
      lightboxImg.src = photos[current];
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
    }
    function show(delta) {
      current = (current + delta + TOTAL) % TOTAL;
      lightboxImg.src = photos[current];
    }

    lightbox.querySelector('.close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') show(-1);
      if (e.key === 'ArrowRight') show(1);
    });
  </script>
</body>
</html>
