  <script>
    window.updateEdgeScrollbar = function updateEdgeScrollbar() {
      const root = document.documentElement;
      const scrollHeight = Math.max(window.innerHeight, root.scrollHeight);
      const max = Math.max(1, scrollHeight - window.innerHeight);
      const progress = Math.min(1, Math.max(0, window.scrollY / max));
      const perimeter = (window.innerWidth * 2) + (window.innerHeight * 2);
      const thumb = Math.min(0.95, Math.max(0.01, (window.innerWidth * 0.25) / perimeter));
      root.style.setProperty('--edge-scroll-thumb', String(thumb));
      root.style.setProperty('--edge-scroll-offset', String(progress * -1));
    };
    window.addEventListener('scroll', window.updateEdgeScrollbar, { passive: true });
    window.addEventListener('resize', window.updateEdgeScrollbar);
    window.addEventListener('load', window.updateEdgeScrollbar);
    window.updateEdgeScrollbar();
    let edgeScrollState = '';
    function watchEdgeScrollbar() {
      const root = document.documentElement;
      const nextState = [
        window.scrollY,
        window.innerWidth,
        window.innerHeight,
        root.scrollHeight
      ].join(':');
      if (nextState !== edgeScrollState) {
        edgeScrollState = nextState;
        window.updateEdgeScrollbar();
      }
      window.requestAnimationFrame(watchEdgeScrollbar);
    }
    window.requestAnimationFrame(watchEdgeScrollbar);
  </script>

    reloadButton.addEventListener('click', () => {

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatEnglishText(text) {
      const escaped = escapeHtml(text);
      return escaped
        .replace(
          /[A-Za-z0-9][A-Za-z0-9\s.,'’:&()/]*/g,
          '<span class="en">$&</span>'
        )
        .replace(/[—×]/g, '<span class="symbol">$&</span>')
        .replace(/\(/g, '<span class="open-paren">(</span>');
    }

    const paleCandidates = [58, 59, 62, 63, 64, 65, 66, 67, 68, 69];
    const hiddenPalePhotos = new Set(
      [...paleCandidates]
        .sort(() => Math.random() - 0.5)
        .slice(0, 5)
        .map((number) => `photos/${number}.webp`)
    );

    const photos = Array.from(
      { length: TOTAL },
      (_, index) => `photos/${index + 1}.webp`
    ).filter((src) => !hiddenPalePhotos.has(src));

    for (let i = photos.length - 1; i > 0; i--) {
      const randomIndex = Math.floor(Math.random() * (i + 1));
      [photos[i], photos[randomIndex]] = [photos[randomIndex], photos[i]];
    }


    photos.forEach((src, index) => {
      const figure = document.createElement('figure');
      const img = document.createElement('img');
      figure.dataset.layoutRandom = Math.random();
      img.src = src;
      img.alt = `photo ${src.match(/\d+/)[0]}`;
      img.loading = 'eager';
      img.addEventListener('load', scheduleLayout);
      figure.appendChild(img);
      figure.addEventListener('click', () => openLightbox(index));
      grid.appendChild(figure);
    });

    let layoutFrame;

    function scheduleLayout() {
      cancelAnimationFrame(layoutFrame);
      layoutFrame = requestAnimationFrame(layoutGallery);
    }

    function layoutGallery() {
      const containerWidth = grid.clientWidth;
      const figures = [...grid.querySelectorAll('figure')];
      const firstRandom = Number(figures[0]?.dataset.layoutRandom || 0);
      const minColumnCount = mobileQuery.matches ? 4 : 3;
      const columnCount = minColumnCount + Math.floor(firstRandom * (8 - minColumnCount));
      const columns = Array.from({ length: columnCount }, () => []);

      figures.forEach((figure, index) => {
        columns[index % columnCount].push(figure);
      });

      const columnFactors = columns.map((column) =>
        column.reduce((sum, figure) => {
          const img = figure.querySelector('img');
          const ratio = img.naturalWidth && img.naturalHeight
            ? img.naturalWidth / img.naturalHeight
            : 1;
          return sum + 1 / ratio;
        }, 0)
      );

      const equalHeight = containerWidth /
        columnFactors.reduce((sum, factor) => sum + 1 / factor, 0);
      const columnWidths = columnFactors.map(
        (factor) => equalHeight / factor
      );

      let left = 0;

      columns.forEach((column, columnIndex) => {
        const width = columnIndex === columns.length - 1
          ? containerWidth - left
          : columnWidths[columnIndex];
        let top = 0;

        column.forEach((figure, imageIndex) => {
          const img = figure.querySelector('img');
          const ratio = img.naturalWidth && img.naturalHeight
            ? img.naturalWidth / img.naturalHeight
            : 1;
          const height = imageIndex === column.length - 1
            ? equalHeight - top
            : width / ratio;

          figure.style.width = `${width}px`;
          figure.style.height = `${height}px`;
          figure.style.left = `${left}px`;
          figure.style.top = `${top}px`;

          top += height;
        });

        left += width;
      });

      grid.style.height = `${equalHeight}px`;
      updateInterfaceColors();
    }

    function getImageLuminanceAt(img, x, y) {
      if (!img.complete || !img.naturalWidth || !sampleContext) return null;

      const rect = img.getBoundingClientRect();
      const sourceX = ((x - rect.left) / rect.width) * img.naturalWidth;
      const sourceY = ((y - rect.top) / rect.height) * img.naturalHeight;

      if (
        sourceX < 0 ||
        sourceY < 0 ||
        sourceX > img.naturalWidth ||
        sourceY > img.naturalHeight
      ) {
        return null;
      }

      sampleCanvas.width = 1;
      sampleCanvas.height = 1;
      sampleContext.clearRect(0, 0, 1, 1);
      sampleContext.drawImage(
        img,
        sourceX,
        sourceY,
        1,
        1,
        0,
        0,
        1,
        1
      );

      const [red, green, blue] = sampleContext.getImageData(0, 0, 1, 1).data;
      return red * 0.2126 + green * 0.7152 + blue * 0.0722;
    }

    function updateTitleColor() {
      const rect = title.getBoundingClientRect();
      const y = rect.top + rect.height / 2;
      const center = window.innerWidth / 2;
      const sampleOffsets = [-140, -70, 0, 70, 140];
      const luminances = [];

      sampleOffsets.forEach((offset) => {
        const x = Math.min(window.innerWidth - 1, Math.max(0, center + offset));
        const img = document.elementsFromPoint(x, y).find(
          (element) => element.tagName === 'IMG' && element.closest('.grid')
        );
        const luminance = img ? getImageLuminanceAt(img, x, y) : 255;

        if (luminance !== null) luminances.push(luminance);
      });

      const averageLuminance = luminances.length
        ? luminances.reduce((sum, value) => sum + value, 0) / luminances.length
        : 255;

      title.classList.toggle('over-bright-bg', averageLuminance > 178);
    }

    function updateFooterColor() {
      const gridRect = grid.getBoundingClientRect();
      const footerRect = footer.getBoundingClientRect();
      const footerCenter = footerRect.top + footerRect.height / 2;
      const fadeStart = gridRect.bottom - window.innerHeight * 0.33;
      const isOverGallery =
        footerCenter >= gridRect.top && footerCenter <= fadeStart;

      footer.classList.toggle('over-gallery', isOverGallery);
    }

    function updateInterfaceColors() {
      updateFooterColor();
      updateTitleColor();
    }

    const mobileQuery = window.matchMedia(
      '(max-width: 768px) and (hover: none), ' +
      '(max-width: 768px) and (pointer: coarse)'
    );

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function getVisibleFigures(excludedFigure) {
      return [...grid.querySelectorAll('figure')].filter((figure) => {
        const rect = figure.getBoundingClientRect();
        return figure !== excludedFigure &&
          rect.bottom > 0 &&
          rect.top < window.innerHeight &&
          rect.right > 0 &&
          rect.left < window.innerWidth;
      });
    }

    async function runMobileSequence() {
      if (!mobileQuery.matches) return;

      document.body.classList.add('mobile-sequence');
      let activeFigure = null;

      for (let round = 0; round < 3; round++) {
        let candidates = getVisibleFigures(activeFigure);

        while (!candidates.length) {
          await delay(200);
          candidates = getVisibleFigures(activeFigure);
        }

        const nextFigure =
          candidates[Math.floor(Math.random() * candidates.length)];

        nextFigure.classList.add('mobile-clear');
        if (activeFigure) activeFigure.classList.remove('mobile-clear');
        activeFigure = nextFigure;

        await delay(1500);
      }

      document.body.classList.add('mobile-complete');
      document.body.classList.remove('mobile-sequence');
      if (activeFigure) activeFigure.classList.remove('mobile-clear');

      await delay(1500);
      document.body.classList.remove('mobile-complete');
    }

    window.addEventListener('load', () => {
      window.scrollTo(0, 0);
      scheduleLayout();
      setTimeout(runMobileSequence, 100);
    });
    window.addEventListener('resize', scheduleLayout);
    window.addEventListener('scroll', updateInterfaceColors, { passive: true });
    scheduleLayout();
    updateInterfaceColors();

    function openLightbox(index) {
      current = index;
      updateLightbox();
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
    }
    function show(delta) {
      current = (current + delta + photos.length) % photos.length;
      updateLightbox();
    }
    function updateLightbox() {
      const src = photos[current];
      const photoNumber = Number(src.match(/\d+/)[0]);
      lightboxImg.src = src;
      lightboxCaption.innerHTML = formatEnglishText(captions[photoNumber] || "");
    }

    lightbox.querySelector('.close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') show(-1);
      if (e.key === 'ArrowRight') show(1);
    });
