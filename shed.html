<body class="shed-page">
  <!-- Shed archive -->
  <header>
    <h1><a href="index.html">이창 <span class="en">Lee Chang</span></a></h1>
  </header>

  <main class="work shed">
    <section class="shed-intro" aria-label="artist introduction">
      <p class="typewrite" id="intro-ko" aria-label="부산 출생. 「그는 완전히 다르게 살고싶었다. 나에게도 그만한 권리는 있지 않은가」 이 문장을 가끔 되새기며 그림을 그립니다."></p>

      <p class="en typewrite" id="intro-en" aria-label="Born in Busan, South Korea. He wanted to live a completely different life. Don't I have that right as well? He remembers this sentence sometimes. And he paints."></p>

      <p class="en typewrite" id="intro-de" aria-label="Geboren in Busan, Südkorea. Er wollte ein völlig anderes Leben führen. Habe ich nicht auch ein Recht darauf? Manchmal erinnert er sich an diesen Satz. Und er malt."></p>

      <p><a href="mailto:lee.changlegs@gmail.com"><span class="en">lee.changlegs@gmail.com</span></a><br>
      <a href="https://www.instagram.com/lee.changlegs/" target="_blank" rel="noopener"><span class="en">@lee.changlegs</span></a><br>
      &copy; <span class="en">2026</span> 이창 <span class="en">Lee Chang</span></p>
    </section>

    <section class="work-filter" aria-label="Shed filters">
      <button class="work-filter-toggle" type="button" aria-expanded="true" aria-controls="work-filter-panel">
        <span>선반 Shelf</span><span class="work-filter-count" id="work-filter-count"></span>
      </button>
      <div class="work-filter-panel" id="work-filter-panel">
        <div class="work-filter-group" data-filter-group="size">
          <span class="work-filter-label">크기 Size</span>
          <div class="work-filter-options" id="size-options"></div>
        </div>
        <div class="work-filter-group" data-filter-group="material">
          <span class="work-filter-label">소재 Material</span>
          <div class="work-filter-options" id="material-options"></div>
        </div>
        <div class="work-filter-group" data-filter-group="year">
          <span class="work-filter-label">년도 Year</span>
          <div class="work-filter-options" id="year-options"></div>
        </div>
        <button class="work-filter-clear" type="button" id="work-filter-clear">초기화 Reset</button>
      </div>
    </section>

    <section class="work-grid" id="shed-grid" aria-label="All works"></section>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="close" aria-label="close"></button>
    <img id="lightbox-img" src="" alt="">
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <script src="artworks.js?v=20261006-20"></script>
  <script>
    const introTexts = [
      {
        id: 'intro-ko',
        lines: [
          '부산 출생.',
          '「그는 완전히 다르게 살고싶었다. 나에게도 그만한 권리는 있지 않은가」',
          '이 문장을 가끔 되새기며 그림을 그립니다.'
        ]
      },
      {
        id: 'intro-en',
        lines: [
          'Born in Busan, South Korea.',
          "“He wanted to live a completely different life. Don't I have that right as well?”",
          'He remembers this sentence sometimes. And he paints.'
        ]
      },
      {
        id: 'intro-de',
        lines: [
          'Geboren in Busan, Südkorea.',
          '„Er wollte ein völlig anderes Leben führen. Habe ich nicht auch ein Recht darauf?“',
          'Manchmal erinnert er sich an diesen Satz. Und er malt.'
        ]
      }
    ];

    function typeIntro({ id, lines }) {
      const target = document.getElementById(id);
      if (!target) return;

      target.textContent = '';
      target.classList.add('is-typing');

      let lineIndex = 0;
      let charIndex = 0;
      let currentLine = document.createTextNode('');
      target.appendChild(currentLine);

      const timer = window.setInterval(() => {
        currentLine.textContent += lines[lineIndex][charIndex];
        charIndex++;

        if (charIndex < lines[lineIndex].length) return;

        lineIndex++;
        charIndex = 0;

        if (lineIndex >= lines.length) {
          window.clearInterval(timer);
          target.classList.remove('is-typing');
          target.classList.add('is-complete');
          return;
        }

        target.appendChild(document.createElement('br'));
        currentLine = document.createTextNode('');
        target.appendChild(currentLine);
      }, 28);
    }

    introTexts.forEach(typeIntro);

    const grid = document.getElementById('shed-grid');
    const count = document.getElementById('work-filter-count');
    const panel = document.getElementById('work-filter-panel');
    const toggle = document.querySelector('.work-filter-toggle');
    const clear = document.getElementById('work-filter-clear');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const activeFilters = { size: new Set(), material: new Set(), year: new Set() };
    let current = 0;

    const artworks = ARTWORKS.map(({ id, caption }) => {
      const parts = caption.split(' │ ');
      const size = parts[parts.length - 1];
      return {
        id,
        caption,
        year: parts[parts.length - 3],
        material: getMaterialGroup(parts[parts.length - 2]),
        size,
        sizeGroup: getSizeGroup(size)
      };
    });

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatText(text) {
      return escapeHtml(text)
        .replace(
          /[A-Za-z0-9][A-Za-z0-9\s.,'’:&()/]*/g,
          '<span class="en">$&</span>'
        )
        .replace(/[—×]/g, '<span class="symbol">$&</span>')
        .replace(/\(/g, '<span class="open-paren">(</span>');
    }

    function formatCaption(text, separator = '<br>', showArrow = false) {
      const parts = text.split(' │ ');
      const titleCount = Math.max(1, parts.length - 3);

      return parts.map((part, index) => {
        const suffix = showArrow && index === 0 ? ' ↗' : '';
        const formatted = formatText(`${part}${suffix}`);

        if (index >= titleCount) return formatted;

        const languageClass = /[가-힣]/.test(part) ? 'caption-title-ko' : 'caption-title-en';
        return `<span class="caption-title ${languageClass}">${formatted}</span>`;
      }).join(separator);
    }

    function getSizeGroup(size) {
      const dimensions = size.match(/(\d+)×(\d+)/);
      if (!dimensions) return '중간';

      const unitMatch = size.match(/\((mm|cm)\)/i);
      const scale = unitMatch && unitMatch[1].toLowerCase() === 'mm' ? 0.1 : 1;
      const area = Number(dimensions[1]) * scale * Number(dimensions[2]) * scale;
      if (area > 4380) return '큰';
      if (area > 1000) return '중간';
      return '작은';
    }

    function getMaterialGroup(material) {
      const medium = material.toLowerCase().split(/\s+on\s+/)[0].trim();
      return medium.charAt(0).toUpperCase() + medium.slice(1);
    }

    function getMaterialLabel(material) {
      const labels = {
        Oil: '유화 Oil',
        'Mixed media': '혼합재료 Mixed media',
        Watercolors: '수채 Watercolors',
        Pen: '펜 Pen',
        Book: '책 Book'
      };
      return labels[material] || material;
    }

    function getYearStart(year) {
      const match = year.match(/\d{4}/);
      return match ? Number(match[0]) : 0;
    }

    function getFilterLabel(group, value) {
      if (group === 'year') return `${getYearStart(value)}—`;
      if (group === 'material') return getMaterialLabel(value);
      if (group === 'size') {
        const labels = {
          '큰': '큰 Big',
          '중간': '중간 Hm',
          '작은': '작은 Small'
        };
        return labels[value] || value;
      }
      return value;
    }

    function createButton(group, value) {
      const button = document.createElement('button');
      button.className = 'work-filter-button';
      button.type = 'button';
      button.dataset.group = group;
      button.dataset.value = value;
      button.innerHTML = formatText(getFilterLabel(group, value));
      button.addEventListener('click', () => {
        if (activeFilters[group].has(value)) {
          activeFilters[group].delete(value);
          button.classList.remove('is-active');
        } else {
          activeFilters[group].add(value);
          button.classList.add('is-active');
        }
        applyFilters();
      });
      return button;
    }

    function uniqueValues(key) {
      if (key === 'size') return ['큰', '중간', '작은'];
      if (key === 'material') {
        const order = ['Oil', 'Mixed media', 'Watercolors', 'Pen', 'Book'];
        const values = new Set(artworks.map((artwork) => artwork[key]));
        return order.filter((value) => value === 'Book' || values.has(value));
      }
      const values = [...new Set(artworks.map((artwork) => artwork[key]))];
      if (key === 'year') {
        return values.sort((a, b) => getYearStart(b) - getYearStart(a));
      }
      return values;
    }

    function renderFilters() {
      [
        ['size', 'size-options'],
        ['material', 'material-options'],
        ['year', 'year-options']
      ].forEach(([group, id]) => {
        const target = document.getElementById(id);
        uniqueValues(group).forEach((value) => {
          target.appendChild(createButton(group, value));
        });
      });
    }

    function renderGrid() {
      artworks.forEach((artwork, index) => {
        const card = document.createElement('a');
        card.className = 'work-card';
        card.href = `photos/${artwork.id}.webp`;
        card.dataset.size = artwork.sizeGroup;
        card.dataset.material = artwork.material;
        card.dataset.year = artwork.year;
        card.dataset.index = String(index);
        card.innerHTML = `
          <img src="photos/${artwork.id}.webp" alt="${escapeHtml(artwork.caption)}" loading="lazy" decoding="async">
          <span class="work-caption">${formatCaption(artwork.caption, '<br>', true)}</span>
        `;
        card.addEventListener('click', (event) => {
          event.preventDefault();
          openLightbox(index);
        });
        grid.appendChild(card);
      });
    }

    function matchesFilters(card) {
      return Object.entries(activeFilters).every(([group, values]) =>
        !values.size || values.has(card.dataset[group])
      );
    }

    function applyFilters() {
      let visible = 0;
      grid.querySelectorAll('.work-card').forEach((card) => {
        const isVisible = matchesFilters(card);
        card.hidden = !isVisible;
        if (isVisible) visible++;
      });
      count.textContent = `(${visible})`;
    }

    toggle.addEventListener('click', () => {
      const isHidden = panel.hidden;
      panel.hidden = !isHidden;
      toggle.setAttribute('aria-expanded', String(isHidden));
    });

    clear.addEventListener('click', () => {
      Object.values(activeFilters).forEach((values) => values.clear());
      document.querySelectorAll('.work-filter-button').forEach((button) => {
        button.classList.remove('is-active');
      });
      applyFilters();
    });

    function openLightbox(index) {
      current = index;
      updateLightbox();
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
    }

    function show(delta) {
      current = (current + delta + artworks.length) % artworks.length;
      updateLightbox();
    }

    function updateLightbox() {
      const artwork = artworks[current];
      lightboxImg.src = `photos/${artwork.id}.webp`;
      lightboxImg.alt = artwork.caption;
      lightboxCaption.innerHTML = formatCaption(artwork.caption, ' │ ');
    }

    lightbox.querySelector('.close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (event) => {
      if (!lightbox.classList.contains('open')) return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') show(-1);
      if (event.key === 'ArrowRight') show(1);
    });

    renderFilters();
    renderGrid();
    applyFilters();
  </script>
</body>
</html>
